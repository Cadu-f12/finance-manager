services:
  postgres:
    image: postgres:18
    container_name: ${CONTAINER_NAME_DB}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}       # Opcional: define o usuário padrão
      POSTGRES_DB: ${POSTGRES_DB}        # Opcional: cria um banco inicial automaticamente
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata18:/var/lib/postgresql

volumes:
  pgdata18: