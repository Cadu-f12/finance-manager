
  services:
    postgres:
      image: postgres:18
      container_name: ${POSTGRES_HOST}
      restart: unless-stopped
      environment:
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_DB: ${POSTGRES_DB}
      ports:
        - "${POSTGRES_PORT}:5432"
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
        interval: 5s
        timeout: 5s
        retries: 5
        start_period: 10s
      volumes:
        - pgdata18:/var/lib/postgresql
      networks:
        - finance-net

    api:
      build: ./stack/finance-api
      container_name: ${CONTAINER_NAME_API}
      restart: unless-stopped
      ports:
        - "${FINANCE_API_PORT}:8080"
      environment:
        POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
        POSTGRES_PORT: 5432
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      depends_on:
        postgres:
          condition: service_healthy
      networks:
        - finance-net

  networks:
    finance-net:
      driver: bridge

  volumes:
    pgdata18:
